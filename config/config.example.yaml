# workspace_root: 統一工作空間根（也是 sandbox 文件保護邊界）。默認即以啟動 dsc 的

# 目錄為根（在哪个目录启动，就以哪个目录为工作区，对齐 REX/Claude Code）。

# 如需覆盖，请配置为绝对路径，例如 workspace_root: D:/work/project

# （相对路径配置不再参与决定根）。

default_llm: llm-anthropic
# 上下文窗口容量（token 数）。不配置（0）时：若为本地 LLAMACPP 服务则探测其 /v1/models 的 n_ctx，

# 探测失败则回退默认 128K（按 *1024 计，即 131072）。

#context_window: 131072

# 压缩后端插件（声明 Provides compaction 能力）：缺省 dsc-system，亦可选
# dsc-billion-context。**压缩是 agent 的强依赖**（agent 自己不实现压缩）：至少要有
# 一个声明该能力的插件处于启用状态；只启用一个时可删掉本行（唯一候选自动当值），
# 启用多个则必须在这里点名——否则启动会失败并提示点名。
compaction: dsc-system

# 权限范围预授予（可选）。范围是**能力的权限属性**，不是工具名：
#   process.spawn  在本机拉起子进程（MCP stdio 服务器、浏览器、computer-use）
#   net.egress     对外发网络请求
#   fs.write       写文件（沙箱按路径策略强制）
# 写在这里的范围启动即视为已授权，不再逐次弹审批；不写则按 DSC_APPROVAL_GRANULARITY
# 的粒度处理（tool=每次都问 / scope=问一次即记住）。默认什么都不预授予。
#authorization:
#  granted_scopes: [process.spawn, net.egress]

# 恢复历史注入（/settings history 写回）：-1 禁止（不注入从存档恢复的历史）、
# 0 未定义（未设置，按默认处理 = 不限制）、N>0 只注入恢复历史中最近 N 条。
# 它只影响「从存档恢复的历史」：同一会话内已经发生的轮次始终完整保留。

#history_injection: -1

# TUI 启动回显的恢复历史条数（显示层，独立于上面的注入条数）：-1 不显示、
# 0 未设置（默认显示 20 条）、N>0 显示最近 N 条。受 history_injection 门控：
# 注入关闭（<0）时不显示；实际显示不会超过注入量（只显示 user/assistant）。
# 滚到顶部会自动向前回填更旧消息（每页 history_shows 条，可读至会话开头）。
# 注意取舍：首屏受 history_injection 注入量约束（只显示模型也记得的部分），
# 但向上翻页读的是全量会话历史、不受注入上限约束。
# 例：history_injection: 0（不限制注入）+ history_shows: 5
#     → 模型拿全部恢复历史，界面只回显最近 5 条。

#history_shows: 0
plugins:
  - name: llm-anthropic
    type: llm
    binary_path: ./plugins/llm-anthropic/llm-anthropic.exe
    enabled: true
    env:
      # 优先读取 DSC_ 前缀（避免与终端同名 ANTHROPIC_* 变量冲突）；DSC_ 未设置时回退旧名
      DSC_ANTHROPIC_BASE_URL: "http://192.168.124.197:8008/"
      DSC_ANTHROPIC_MODEL: "Agentic-Turbo-Coder"
      DSC_ANTHROPIC_API_KEY: "sk-your-real-key"
      # 推理强度（可选）：统一档位 DSC_REASONING_EFFORT (none/minimal/low/medium/high/max) 自动映射为
      # 思考 token 预算（0/2048/4096/8192/16384/32768；none=关闭思考）；或用 DSC_ANTHROPIC_THINKING_BUDGET
      # 直接指定预算（默认 4096）。DSC_ANTHROPIC_THINKING=0 可整体关闭扩展思考
      #（旧名 ANTHROPIC_THINKING 仍兼容）。
      #DSC_REASONING_EFFORT: "high"
      # 单轮输出上限（可选），三态跟随服务端真实语义：-1=无限（原样携带，llama.cpp 即 n_predict=-1）、
      # 0=禁用（请求体不带该字段）、N=指定。不写=宿主启动期探一次服务端上限、之后每帧按
      # 「窗口 − 表面 − 余量」算好下发（推荐：既不会缺值被 anthropic 口自填 4096，也不会越界 400）。
      # 接口专属名 DSC_<PROVIDER>_MAX_OUTPUT_TOKENS
      # 可覆盖本值（见 README「LLM 環境變量」）。默认不写＝宿主按帧填；
      # 云端若要「干脆不带这个字段」，写 0（别写 -1：那是无限，云端会以 400 拒绝）。
      #DSC_MAX_OUTPUT_TOKENS: "0"
  - name: llm-openai
    type: llm
    binary_path: ./plugins/llm-openai/llm-openai.exe
    enabled: true
    env:
      # 优先读取 DSC_ 前缀；DSC_ 未设置时回退旧名
      DSC_OPENAI_BASE_URL: "http://192.168.124.197:8008/v1"
      DSC_OPENAI_MODEL: "Agentic-Turbo-Coder"
      DSC_OPENAI_API_KEY: "sk-your-real-key"
      # 推理强度（可选）：统一档位 DSC_REASONING_EFFORT (none/minimal/low/medium/high/max) 自动映射为
      # reasoning_effort 字面量（6 档 1:1 透传）；或用 DSC_OPENAI_REASONING_EFFORT 传
      # 端点支持的字面量（如 xhigh 等文档外档位）绕过统一映射。仅对推理模型有效，非推理模型忽略。
      #DSC_REASONING_EFFORT: "high"
      # 单轮输出上限（可选），三态跟随服务端真实语义：-1=无限（原样携带，llama.cpp 即 n_predict=-1）、
      # 0=禁用（请求体不带该字段）、N=指定。不写=宿主启动期探一次服务端上限、之后每帧按
      # 「窗口 − 表面 − 余量」算好下发（推荐：既不会缺值被 anthropic 口自填 4096，也不会越界 400）。
      # 接口专属名 DSC_<PROVIDER>_MAX_OUTPUT_TOKENS
      # 可覆盖本值（见 README「LLM 環境變量」）。默认不写＝宿主按帧填；
      # 云端若要「干脆不带这个字段」，写 0（别写 -1：那是无限，云端会以 400 拒绝）。
      #DSC_MAX_OUTPUT_TOKENS: "0"
  - name: tool-filesystem
    type: tool
    binary_path: ./plugins/tool-filesystem/tool-filesystem.exe
    enabled: true
  # 记忆服务：memory_search / memory_add 等工具 + 推理被动记录 / 任务收尾插播提醒
  - name: tool-memory-service
    type: tool
    binary_path: ./plugins/tool-memory-service/tool-memory-service.exe
    enabled: true
  # 通知音效：通用(dsc) 类型插件，经 Hook.OnEvent 程序性播放 success/error 完成音效
  - name: dsc-notify
    type: dsc
    binary_path: ./plugins/dsc-notify/dsc-notify.exe
    enabled: true
  # MCP 客户端（插件）：连接外部 MCP 服务器（stdio / streamable HTTP），把它们的工具
  # 接成 mcp__<server>__<tool>。默认**不注入**（连接与开关都在插件自己的状态里，
  # `/mcp on` 打开），日常会话目录成本为 0。
  # 服务器配置写在 config: 块里（宿主原样以 JSON 交给插件，不解析）：
  #   config:
  #     mcp:
  #       servers:
  #         - name: fs
  #           transport: stdio
  #           command: node
  #           args: ["O:/tools/mcp-fs.mjs"]
  - name: tool-mcp
    type: tool
    binary_path: ./plugins/tool-mcp/tool-mcp.exe
    enabled: true
  # LUA HOST：空壳工具插件，加载 LUA 脚本（运行已创建的工具；新脚本仅在创造模式生效）
  - name: tool-lua-host
    type: tool
    binary_path: ./plugins/tool-lua-host/tool-lua-host.exe
    enabled: true
  # SQL HOST：以 .dsp（dsc's plugin，实质为 SQLite 库）为载体加载插件——元数据、
  # 代码与运行期状态同处一个文件，插件经 dsc.sql.*/dsc.store.* 读写自身
  - name: tool-sql-host
    type: tool
    binary_path: ./plugins/tool-sql-host/tool-sql-host.exe
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    binary_path: ./plugins/tool-str-replace-editor/tool-str-replace-editor.exe
    enabled: true
  - name: agent-react-loop
    type: agent
    binary_path: ./plugins/agent-react-loop/agent-react-loop.exe
    enabled: true
  # 选用 billion-context 需要**同时**改两处，缺一处就是岗位空缺（启动会失败并说明原因）：
  #   1) 顶部 compaction: dsc-billion-context
  #   2) 下面这段 plugins 条目（去掉注释、enabled: true）
  # 注意 Windows 的 binary_path 要带 .exe，否则加载失败只留一条插件启动错误。
  # - name: dsc-billion-context
  #   type: dsc
  #   enabled: true
  #   binary_path: ./plugins/dsc-billion-context/dsc-billion-context.exe
