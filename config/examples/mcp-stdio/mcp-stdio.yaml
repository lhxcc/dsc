# MCP 配置示例：stdio 传输（把服务器作为本机子进程）
#
# 用法：
#   dsc -patch config/examples/mcp-stdio/mcp-stdio.yaml
#
# 插件在启动时拉起这个命令，经它的 stdin/stdout 讲 JSON-RPC，发现的工具注册为
# mcp__<name>__<rawName>。凡是以「本地命令」形式发布的 MCP 服务器都适用
# （node / python / uvx / 自带二进制），不需要先把它跑起来，也不占端口。
#
# 与 HTTP 传输的区别：
#   - 进程随插件生命周期：断开或插件退出时回收（Windows 由 Job Object 兜底，POSIX 由
#     Close 关 stdin 再等 3 秒后 kill）。
#   - 子进程**不继承**整份环境：只有 PATH/HOME/TEMP 等基线，另加下面 env 里显式写的项。
#     服务器需要的 token 必须自己写——这是一个明确的授权动作。
#
# 建议直接指向解释器/二进制，而不是 npx / uvx 这类**启动器**：被 kill 的是启动器本身，
# POSIX 上它拉起的真实服务器可能变成孤儿进程。用 npx 只适合一次性试用。
- name: tool-mcp
  type: tool
  enabled: true
  config:
    mcp:
      servers:
        - name: files                  # 工具名前缀：mcp__files__*
          transport: stdio
          command: npx                  # 走 PATH 解析；也可写绝对路径（推荐）
          args:
            - -y
            - "@modelcontextprotocol/server-filesystem"
            - O:/workspace              # 换成要暴露给该服务器的真实目录
          # cwd: O:/workspace           # 服务器按相对路径找资源时才需要
          # env:                        # 只有这里写明的变量才会进子进程
          #   SOME_TOKEN: ""
