# MCP 配置示例：stdio 传输（把服务器作为本机子进程）
#
# 用法：
#   dsc -patch config/examples/mcp-rea-stdio/mcp-rea-stdio.yaml
#
# 这里以 rea-agents 为例（`rea mcp` 默认就说 stdio）：宿主启动时拉起
# `node <repo>/scripts/rea.mjs mcp`，工具注册为 mcp__rea__<rawName>（实测 229 个）。
#
# 与 HTTP 传输的区别：
#   - 不需要事先把服务器跑起来、也不占端口；进程随宿主生命周期（断开/退出时回收）。
#   - 子进程**不继承**宿主整份环境：只有 PATH/HOME/TEMP 等基线，另加下面 env 里显式
#     写的项。服务器需要的 token 必须自己在这里写——这是明确的授权动作。
- name: mcp-rea
  type: dsc
  # enabled 必须显式写 true：普通 bool，省略即 false，整条会被跳过（日志里有告警）。
  enabled: true
  config:
    mcp:
      server_name: rea            # 工具名前缀：mcp__rea__*
      transport: stdio
      command: node               # 走 PATH 解析；也可写绝对路径
      args:
        - O:/Agents/rea-agents/scripts/rea.mjs
        - mcp
      cwd: O:/Agents/rea-agents   # 服务器按相对路径找资源时需要
      # env:                      # 只有这里写明的变量才会进子进程
      #   REA_LOG_LEVEL: info
