# MCP 配置示例：HTTP 传输（服务器已在监听）
#
# 用法：
#   dsc -patch config/examples/mcp-memory/mcp-memory.yaml
#
# 这条 patch 覆盖的是 **tool-mcp 插件**（type: tool）：宿主原样把 config: 块以 JSON
# 交给插件（DSC_PLUGIN_CONFIG），形状与含义由插件解释——宿主不解析、不认识 MCP。
#
# 连接时机是插件启动；发现的工具注册为 mcp__<name>__<rawName>，但对模型**默认不可见**
# （一台服务器可能有几百个工具）。用 /mcp on 打开总闸，再 /mcp load 加载要用的那几个。
- name: tool-mcp
  type: tool
  # enabled 必须显式写 true：普通 bool，省略即 false，整条会被跳过（日志里有告警）。
  enabled: true
  config:
    mcp:
      servers:
        - name: memory                 # 工具名前缀：mcp__memory__*
          transport: http
          endpoint: http://localhost:3100/mcp
